# Mail: one stdlib Python container; the app source is inlined below (refresh with `python3 tools/package.py`).
# Mail keeps no data and no secrets: it asks the Google and Microsoft apps over the Wizard app network.
services:
  wizard-mail:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    pids_limit: 64
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 160m
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,size=32m,uid=1000,gid=1000
    environment:
      PORT: '18818'
      APP_PORT: ${APP_PORT:-18818}
      BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: '1'
      WIZARD_SHELL_AUTH: ${WIZARD_SHELL_AUTH:-tailscale-serve}
      WIZARD_OWNER_LOGINS: ${WIZARD_OWNER_LOGINS:-}
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_OWNER_TOKEN: ${WIZARD_OWNER_TOKEN:-}
      WIZARD_ADMIN_TOKEN: ${WIZARD_ADMIN_TOKEN:-}
      MAIL_SOURCES: ${MAIL_SOURCES:-google=http://wizard-google:18812,microsoft=http://wizard-microsoft:18814}
    command:
    - python
    - -c
    - "import base64,json,pathlib,runpy,zlib\nroot=pathlib.Path('/tmp/wizard-app');root.mkdir(exist_ok=True)\nfiles=json.loads(zlib.decompress(base64.b64decode('')))\nfor name,text in files.items():\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)\nrunpy.run_path(str(root/'app/server.py'),run_name='__main__')\n"
    x-runtipi:
      is_main: true
      internal_port: 18818
x-runtipi:
  schema_version: 2
  overrides: []
