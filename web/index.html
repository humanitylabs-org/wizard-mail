<!doctype html>
<html lang="en" data-app="wizard-mail">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Mail</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-tokens.css">
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="standalone.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/app-client.js"></script>
  <script defer src="wizard-sheet.js"></script>
  <script defer src="connect.js"></script>
  <script defer src="settings.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="wz-app wm-root">
    <div class="wm" data-view="list">
      <aside class="wm-side" aria-label="Mailboxes">
        <button type="button" class="wz-button wm-write" data-act="write">Write</button>
        <nav class="wm-nav wm-nav-accounts" aria-label="Accounts"></nav>
        <nav class="wm-nav wm-nav-folders" aria-label="Folders"></nav>
        <button type="button" class="wm-add" data-act="add">+ Add account</button>
      </aside>
      <section class="wm-listpane" aria-label="Messages">
        <div class="wm-top">
          <button type="button" class="wz-chip wm-scope" data-act="scope" aria-haspopup="dialog">All inboxes</button>
          <button type="button" class="wz-button secondary small wm-markall" data-act="markall" hidden>Mark all as read</button>
          <span class="wm-tools">
          <button type="button" class="wm-icon" data-act="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>
          <button type="button" class="wm-icon wm-gear" data-act="settings" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <button type="button" class="wz-button wm-write wm-write-top" data-act="write">Write</button>
          </span>
        </div>
        <form class="wm-search" role="search" autocomplete="off">
          <input class="wz-field" type="search" name="q" placeholder="Search mail" aria-label="Search mail" enterkeyhint="search" maxlength="300">
        </form>
        <div class="wm-folders" role="tablist" aria-label="Folders"></div>
        <div class="wm-filter"><button type="button" class="wz-chip wm-unreadf" data-act="unread" aria-pressed="false">Unread</button></div>
        <div class="wm-banner" hidden></div>
        <section class="wm-drafts" aria-label="Drafts waiting for you" hidden></section>
        <div class="wm-pull" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></div>
        <div class="wm-list" role="list" aria-live="polite"></div>
        <button type="button" class="wz-button secondary wm-more" data-act="more" hidden>Load more</button>
        <div class="wm-bbar">
          <div class="wm-bcells">
            <button type="button" class="wm-bcell" data-act="write"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg><span>Write</span></button>
            <button type="button" class="wm-bcell" data-act="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></button>
            <button type="button" class="wm-bcell" data-act="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg><span>Refresh</span></button>
          </div>
          <form class="wm-bsearch" role="search" autocomplete="off" hidden>
            <input class="wz-field" type="search" name="q" placeholder="Search mail" aria-label="Search mail" enterkeyhint="search" maxlength="300">
            <button type="button" class="wm-icon wm-bclose" data-act="unfind" aria-label="Close search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </form>
        </div>
      </section>
      <section class="wm-reader" aria-label="Message">
        <div class="wm-placeholder"><span class="wz-tile" aria-hidden="true">✉</span><p>Choose a message to read it.</p></div>
      </section>
      <section class="wm-connect" hidden></section>
    </div>
    <p class="wz-status wm-toast" role="status" aria-live="polite"></p>
  </div>
</body>
</html>
